<!DOCTYPE html>
<html>
<head>
  <title>Multiple Image Upload Test</title>
</head>

<body>
  <h2>Upload 2–3 Images to Neon</h2>

  <label>
    Username
    <input id="admin-username" autocomplete="username">
  </label>

  <label>
    Password
    <input type="password" id="admin-password" autocomplete="current-password">
  </label>

  <br><br>

  <input
    type="file"
    id="images"
    accept="image/*"
    multiple
  >

  <br><br>

  <button onclick="uploadImages()">
    Upload Images
  </button>

  <br><br>

  <pre id="result"></pre>

  <script>
    async function uploadImages() {
      const input = document.getElementById("images");
      const username = document.getElementById("admin-username").value;
      const password = document.getElementById("admin-password").value;
      const result = document.getElementById("result");

      const files = input.files;

      if (files.length < 2 || files.length > 3) {
        result.textContent = "Please select 2 or 3 images.";
        return;
      }

      if (!username || !password) {
        result.textContent = "Please enter your username and password.";
        return;
      }

      const formData = new FormData();

      for (const file of files) {
        formData.append("images", file);
      }

      result.textContent = "Uploading...";

      try {
        const loginResponse = await fetch(
          "https://pizza-whatsapp-ai-bot.vercel.app/admin/login",
          {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ username, password })
          }
        );
        const login = await loginResponse.json();
        if (!loginResponse.ok) throw new Error(login.message || "Sign in failed");

        const response = await fetch(
          "https://pizza-whatsapp-ai-bot.vercel.app/images/upload",
          {
            method: "POST",
            headers: { "Authorization": `Bearer ${login.token}` },
            body: formData
          }
        );

        // Read the response as plain text first.
        // This lets us see the real server response
        // even if the server returns HTML instead of JSON.
        const text = await response.text();

        result.textContent =
          `HTTP Status: ${response.status}\n\n` +
          text;

      } catch (error) {
        result.textContent =
          "Upload failed:\n\n" + error.message;
      }
    }
  </script>
</body>
</html>
